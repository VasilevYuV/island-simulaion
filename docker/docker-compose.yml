version: '3.8'
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: island-simulation:latest
    container_name: island-simulation-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
    networks:
      - island-network
    restart: unless-stopped

networks:
  island-network:
    driver: bridge