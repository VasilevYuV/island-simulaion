spring:
  application:
    name: island-simulation
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:island_db
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  web:
    resources:
      cache:
        period: 0

server:
  port: 8080
  servlet:
    context-path: /
  address: 0.0.0.0

# Конфигурация симуляции острова
island:
  simulation:
    min-width: 50
    max-width: 200
    min-height: 10
    max-height: 50
    default-width: 100
    default-height: 20
    turn-duration-ms: 1000
    statistics-save-interval: 10

    # Лимиты
    max-turns-without-animals: 100
    max-total-turns: 10000

# Логирование
logging:
  level:
    com.VasilevYuV.island: DEBUG
    org.springframework: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/island-simulation.log