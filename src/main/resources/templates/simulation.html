<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Island Simulation</title>
    <script src="/webjars/sockjs-client/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/stomp.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Manrope_Cut_008 Medium", sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 95vw;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-pause { background: #f6ad55; color: white; }
        .btn-resume { background: #68d391; color: white; }
        .btn-stop { background: #fc8181; color: white; }
        .btn:hover { transform: translateY(-2px); }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            flex: 1;
            min-height: 0; /* Important for flexbox scrolling */
        }

        .island-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            min-height: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .island-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            min-height: 0;
            max-width: 100%;
        }

        .island-grid {
            display: grid;
            gap: 1px;
            background: #2d5a27;
            padding: 10px;
            border-radius: 8px;
            margin: 0 auto;
            max-width: 100%;
            max-height: 100%;
            width: fit-content;
            box-sizing: content-box;
        }

        .cell {
            min-width: 8px;
            min-height: 8px;
            background: #4a7c59;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            border-radius: 1px;
            transition: all 0.3s;
            aspect-ratio: 1; /* Maintain square cells */
        }

        .cell:hover {
            transform: scale(1.3);
            z-index: 10;
            box-shadow: 0 0 8px rgba(255,255,255,0.7);
        }

        .statistics {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .stat-card {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .species-list {
            max-height: 400px;
            overflow-y: auto;
            flex: 1;
        }

        .species-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .turn-info {
            font-size: 18px;
            font-weight: bold;
            color: #2d3748;
        }

        .status-running { color: #38a169; }
        .status-paused { color: #dd6b20; }
        .status-stopped { color: #e53e3e; }

        /* Responsive design */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto 400px;
            }

            .statistics {
                max-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100vw;
                padding: 10px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .speed-control {
                justify-content: center;
            }

            .main-content {
                gap: 15px;
            }
        }

        .island-title {
            text-align: center;
            margin-bottom: 15px;
            color: #2d3748;
        }

        .scale-info {
            text-align: center;
            font-size: 12px;
            color: #718096;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏝️ Island Simulation</h1>
        <div class="controls">
            <button class="btn btn-pause" onclick="sendControl('PAUSE')">⏸️ Pause</button>
            <button class="btn btn-resume" onclick="sendControl('RESUME')">▶️ Resume</button>
            <button class="btn btn-stop" onclick="sendControl('STOP')">⏹️ Stop</button>

            <div class="speed-control">
                <label>Speed:</label>
                <input type="range" id="speedSlider" min="100" max="5000" value="1000"
                       onchange="changeSpeed(this.value)">
                <span id="speedValue">1000ms</span>
            </div>

            <div class="turn-info">
                Turn: <span id="currentTurn">0</span>
                Status: <span id="simulationStatus" class="status-running">Running</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="island-container">
            <h3 class="island-title">Island Map</h3>
            <div class="island-wrapper">
                <div id="islandGrid" class="island-grid"></div>
            </div>
            <div class="scale-info" id="scaleInfo">Scale: 100%</div>
        </div>

        <div class="statistics">
            <h3>📊 Statistics</h3>
            <div class="stat-card">
                <div>Total Animals: <span id="totalAnimals">0</span></div>
                <div>Total Plants: <span id="totalPlants">0</span></div>
                <div>Island Size: <span id="islandSize">100x20</span></div>
            </div>

            <h4>Species Population</h4>
            <div class="species-list" id="speciesList">
                <!-- Species will be populated by JavaScript -->
            </div>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let currentState = null;
    let currentScale = 1;

    function connect() {
        const socket = new SockJS('/ws-island');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);

            stompClient.subscribe('/topic/island-update', function(message) {
                const state = JSON.parse(message.body);
                updateIsland(state);
            });

            stompClient.subscribe('/topic/statistics', function(message) {
                updateStatistics(JSON.parse(message.body));
            });

            // Запрашиваем начальную статистику
            stompClient.send("/app/statistics", {});
        });
    }

    function updateIsland(state) {
        currentState = state;

        // Обновляем общую информацию
        document.getElementById('currentTurn').textContent = state.currentTurn;
        document.getElementById('totalAnimals').textContent = state.totalAnimals;
        document.getElementById('totalPlants').textContent = state.totalPlants;
        document.getElementById('islandSize').textContent = state.width + 'x' + state.height;

        // Обновляем сетку острова
        updateGrid(state);

        // Обновляем список видов
        updateSpeciesList(state.speciesCount);
    }

    function calculateOptimalCellSize(width, height, availableWidth, availableHeight) {
        const maxCellSize = 20;
        const minCellSize = 4;

        // Учитываем gap между клетками (1px между каждой)
        const totalGapWidth = (width - 1) * 1;
        const totalGapHeight = (height - 1) * 1;

        // Учитываем padding grid (10px с каждой стороны = 20px)
        const availableGridWidth = availableWidth - 10;
        const availableGridHeight = availableHeight - 10;

        // Вычисляем размер клетки с учетом gap
        const widthBasedSize = Math.floor((availableGridWidth - totalGapWidth) / width);
        const heightBasedSize = Math.floor((availableGridHeight - totalGapHeight) / height);

        let cellSize = Math.min(widthBasedSize, heightBasedSize, maxCellSize);
        cellSize = Math.max(cellSize, minCellSize);

        console.log(`Cell calculation: width=${width}, available=${availableWidth}, cellSize=${cellSize}`);
        return cellSize;
    }

    function updateGrid(state) {
        const grid = document.getElementById('islandGrid');
        const wrapper = grid.parentElement;
        const availableWidth = wrapper.clientWidth - 40;
        const availableHeight = wrapper.clientHeight - 40;

        const cellSize = calculateOptimalCellSize(state.width, state.height, availableWidth, availableHeight);

        currentScale = (cellSize / 20 * 100).toFixed(0);
        document.getElementById('scaleInfo').textContent = `Scale: ${currentScale}%`;

        grid.style.gridTemplateColumns = `repeat(${state.width}, ${cellSize}px)`;
        grid.style.gap = '1px';

        let html = '';
        for (let y = 0; y < state.height; y++) {
            for (let x = 0; x < state.width; x++) {
                const location = state.grid[x][y];
                html += `<div class="cell" style="width: ${cellSize}px; height: ${cellSize}px; font-size: ${Math.max(cellSize - 4, 6)}px;"
                         title="X:${x}, Y:${y}\nAnimals: ${location.animalCount}\nPlants: ${location.plantCount}">${getCellSymbol(location)}</div>`;
            }
        }
        grid.innerHTML = html;
    }

    function getCellSymbol(location) {
        if (!location) return '';

        const dominant = location.dominantSpecies;
        const symbols = {
            'wolf': '🐺', 'bear': '🐻', 'fox': '🦊', 'eagle': '🦅',
            'rabbit': '🐇', 'deer': '🦌', 'mouse': '🐁', 'duck': '🦆',
            'boa': '🐍', 'horse': '🐎', 'boar': '🐗', 'buffalo': '🐃',
            'goat': '🐐', 'sheep': '🐑', 'caterpillar': '🐛'
        };

        return symbols[dominant] || (location.plantCount > 0 ? '🌿' : '');
    }

    function updateSpeciesList(speciesCount) {
        const speciesList = document.getElementById('speciesList');
        let html = '';

        Object.entries(speciesCount)
            .sort((a, b) => b[1] - a[1])
            .forEach(([species, count]) => {
                html += `
                        <div class="species-item">
                            <span>${getCellSymbol({dominantSpecies: species})} ${species}</span>
                            <span>${count}</span>
                        </div>
                    `;
            });

        speciesList.innerHTML = html || '<div class="species-item">No animals</div>';
    }

    function sendControl(type) {
        fetch('/api/control?action=' + type.toLowerCase(), {
            method: 'POST'
        }).then(response => response.text())
            .then(result => {
                console.log('Control result:', result);
                // Обновляем статус
                const statusElement = document.getElementById('simulationStatus');
                if (type === 'PAUSE') {
                    statusElement.textContent = 'Paused';
                    statusElement.className = 'status-paused';
                } else if (type === 'RESUME') {
                    statusElement.textContent = 'Running';
                    statusElement.className = 'status-running';
                } else if (type === 'STOP') {
                    statusElement.textContent = 'Stopped';
                    statusElement.className = 'status-stopped';
                }
            })
            .catch(error => console.error('Control error:', error));
    }

    function changeSpeed(speed) {
        document.getElementById('speedValue').textContent = speed + 'ms';
        fetch('/api/control?action=speed&speed=' + speed, {
            method: 'POST'
        }).then(response => response.text())
            .then(result => console.log('Speed change result:', result))
            .catch(error => console.error('Speed change error:', error));
    }

    // Ресайз для адаптивности
    window.addEventListener('resize', function() {
        if (currentState) {
            updateGrid(currentState);
        }
    });

    // Подключаемся при загрузке страницы
    connect();
</script>
</body>
</html>
